<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1eee7" />
    <script>
      ;(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('aegis.theme') || 'null')
          const theme = saved && saved.state && saved.state.theme === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#05080e' : '#f1eee7')
        } catch {
          /* keep the light default */
        }
      })()
    </script>
    <meta
      name="description"
      content="Aegis Sentinel correlates global vulnerability intelligence with your own asset inventory and tells you what to fix first."
    />
    <title>Aegis Sentinel — Threat early warning, prioritised</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
