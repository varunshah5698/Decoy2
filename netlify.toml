[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "ai-chat"
  path = "/api/ai/chat"

[[redirects]]
  from = "/api/feeds/kev"
  to = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
